# Phoenix Lynx boot loader: 16K ROM image for $C000-$FFFF.  Code must stay
# below $FC00 (Suzy, Mikey and the loader's I/O window are above); the
# vectors are at $FFFA.  The core's CPU starts at $FF80 after a reset (where
# the Lynx boot ROM's code starts), not at the reset vector.  RAM: $0200-$1FFF (the directory listing, the
# sector cache and the screen are at fixed places above, see main.c).
SYMBOLS {
    __STACKSIZE__: type = weak, value = $0400;
}
MEMORY {
    ZP:   file = "", define = yes, start = $0000, size = $0100;
    RAM:  file = "", define = yes, start = $0200, size = $1E00;
    ROM:  file = %O, define = yes, start = $C000, size = $3C00, fill = yes, fillval = $FF;
    PAD:  file = %O,               start = $FC00, size = $0380, fill = yes, fillval = $FF;
    ENTRY: file = %O,              start = $FF80, size = $007A, fill = yes, fillval = $FF;
    VEC:  file = %O,               start = $FFFA, size = $0006;
}
SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    STARTUP:  load = ROM, type = ro;
    ONCE:     load = ROM, type = ro,  optional = yes;
    CODE:     load = ROM, type = ro;
    RODATA:   load = ROM, type = ro;
    DATA:     load = ROM, run = RAM, type = rw, define = yes;
    BSS:      load = RAM, type = bss, define = yes;
    ENTRY:    load = ENTRY, type = ro;
    VECTORS:  load = VEC, type = ro;
}
FEATURES {
    CONDES: type = constructor, label = __CONSTRUCTOR_TABLE__,
            count = __CONSTRUCTOR_COUNT__, segment = ONCE;
    CONDES: type = destructor, label = __DESTRUCTOR_TABLE__,
            count = __DESTRUCTOR_COUNT__, segment = RODATA;
}
